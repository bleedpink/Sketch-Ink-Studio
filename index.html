<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),K=['sk','cl'];
const S={W:960,H:540,fps:12,fr:[],cur:0,tool:'sk',er:0,showSk:1,onion:1,col:{sk:'#2f6bff',cl:'#111111'},size:6,hist:[],play:0,pen:0,vid:null,pc:new Map,pq:{},lr:[],rem:0,all:0,exp:0,st:null};

/* Browser-safe download core: use the host download API when available, otherwise use Blob URLs. */
window.__downloadFile = async function(filename, data) {

    if (window.claude && typeof window.claude.use === 'function') {
      host = await window.claude.use('downloads');
    }
  } catch (err) {
    if (err && err.code === 'declined') throw err;
  }
  if (host && typeof host.save === 'function') {
    try {
      await host.save({ filename: String(filename || 'download'), data });
      return;
    } catch (err) {

    }

  a.style.cssText = 'position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0';

const L=(f,k)=>{f.c=f.c||{};return f.c[k]||(f.c[k]=mk(S.W,S.H))};

/* ---------- brushes: stamp tips (white + alpha), built-in and imported ---------- */
const proc=f=>{const t=mk(256,256),g=ctx(t);g.scale(4,4);f(g);return t};
const B=[

function tint(b,col){if(b.tc&&b.tc.col===col)return b.tc.cv;const t=mk(b.tip.width,b.tip.height),g=ctx(t);g.fillStyle=col;g.fillRect(0,0,t.width,t.height);g.globalCompositeOperation='destination-in';g.drawImage(b.tip,0,0);b.tc={col,cv:t};return t}

  const iv=e/k>127;return v.map(a=>iv?255-a:a)}  // brush edges should be empty; flip if they're bright
async function fromImg(b){const im=new Image;im.src=URL.createObjectURL(b);await im.decode();
  const W=im.naturalWidth||256,H=im.naturalHeight||256,s=Math.min(1,256/Math.max(W,H)),w=Math.max(1,Math.round(W*s)),h=Math.max(1,Math.round(H*s)),t=mk(w,h),g=ctx(t);

  for(let i=0;i<a.length;i++){a[i]=d[i*4+3];lo=Math.min(lo,a[i]);l[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11}

async function procreate(f,nm){if(!window.JSZip)throw 0;const z=await JSZip.loadAsync(f),ps=Object.keys(z.files).filter(p=>/(^|\/)Shape\.png$/i.test(p)),o=[];
  for(const p of ps)o.push({n:ps.length>1?nm+' '+(o.length+1):nm,t:await fromImg(new Blob([await z.file(p).async('arraybuffer')],{type:'image/png'}))});return o}

        const lim=Math.min(nx-19,p+600);   // locate the tip's bounds record after the item header

/* ---------- frames load on demand: video plates via seek queue, drawings as PNG blobs ---------- */
let q=Promise.resolve();
const near=v=>S.all||Math.abs(v-(S.fr[S.cur]||{}).v)<4;

/* ---------- UI ---------- */

  S.W=Math.round(v.videoWidth*s);S.H=Math.round(v.videoHeight*s);S.fps=fpsv();S.vid=v;S.pc.clear();S.pq={};S.lr=[];

/* ---------- drawing ---------- */
let dr=0,lp=null;

  g.globalAlpha=1}
c.onpointerdown=e=>{const f=S.fr[S.cur];if(!f||!f.c||S.play||S.exp)return;if(e.pointerType==='pen')S.pen=1;if(e.pointerType==='touch'&&S.pen)return;

c.onpointermove=e=>{if(!dr)return;for(const ev of(e.getCoalescedEvents?e.getCoalescedEvents():[e])){
  const p=pt(ev),k=1-S.sm,s={x:lp.x+(p.x-lp.x)*k,y:lp.y+(p.y-lp.y)*k,p:p.p};seg(lp,s);lp=s}render()};
c.onpointerup=c.onpointercancel=()=>{if(!dr)return;dr=0;const{f,k}=S.st;save(f,k);if(!f.d){f.d=1;marks()}};

/* ---------- export (real-time recording, so a long video takes its full length) ---------- */
$('#ex').onclick=async e=>{if(S.exp){S.exp=0;return}
  const dl={save:({filename,data})=>window.__downloadFile(filename,data)};

<script id="si-multitrack-script">(()=>{

<script id="professional-shortcuts-v1">
(()=>{
 const byId=id=>document.getElementById(id);
 const click=id=>{const el=byId(id);if(el&&!el.disabled)el.click()};
 const editing=el=>!!el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
 // Native keyboard support for desktop keyboards; harmless on touch-only devices.
 document.addEventListener('keydown',e=>{
   if(editing(e.target))return;
   const mod=e.ctrlKey||e.metaKey;
   if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();click('save-project-top');return}
   if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();click('open-project-top');return}
   if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();click(e.shiftKey?'rd':'un');return}
   if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();click('rd');return}
   if(e.code==='Space'){e.preventDefault();click('pl');return}
   if(e.key==='ArrowLeft'&&!mod){const b=byId('pv');if(b){e.preventDefault();b.click()};return}
   if(e.key==='ArrowRight'&&!mod){const b=byId('nx');if(b){e.preventDefault();b.click()};return}
 });
 const hints=[['save-project-top','Save project (Ctrl/Cmd+S)'],['open-project-top','Open project (Ctrl/Cmd+O)'],['un','Undo (Ctrl/Cmd+Z)'],['rd','Redo (Ctrl/Cmd+Shift+Z)'],['pl','Play / Stop (Space)'],['pv','Previous frame (←)'],['nx','Next frame (→)']];
 for(const [id,title] of hints){const el=byId(id);if(el)el.title=title}
})();
</script>
