    <script>
        /* downloads shim: share sheet on iOS, anchor download elsewhere; skipped if a host already provides window.claude */
        window.claude = window.claude || {
            use: n => n === 'downloads' ? {
                save: async ({
                    filename: f,
                    data: d
                }) => {
                    const e = c => Object.assign(new Error(c), {
                        code: c
                    });
                    try {
                        const F = new File([d], f, {
                            type: d.type
                        });
                        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({
                                files: [F]
                            })) {
                            try {
                                await navigator.share({
                                    files: [F]
                                });
                                return
                            } catch (x) {
                                if (x && x.name === 'AbortError') throw e('declined')
                            }
                        }
                    } catch (x) {
                        if (x.code === 'declined') throw x
                    }
                    const u = URL.createObjectURL(d),
                        a = document.createElement('a');
                    a.href = u;
                    a.download = f;
                    document.body.append(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(u), 6e4)
                }
            } : null
        };
        addEventListener('unhandledrejection', e => {
            e.preventDefault();
            console.warn('Handled:', e.reason)
        });
    </script>

<body>
    <header id="top">
        <span class="wm">Sketch &amp; Ink</span><label class="b p">Open video<input id="vf" type="file" accept="video/*" hidden></label><label class="b">Open image<input id="if" type="file" accept="image/*" hidden></label>
        <button id="nb">New blank</button>
        <label class="b">Import brushes<input id="bf" type="file" multiple hidden></label>
        <label class="fp">fps <input id="fps" type="number" value="12" min="1" max="30"></label>
        <span class="sp"></span>
        <label class="xs ed hide"><input id="xs" type="checkbox"> Include sketch in export</label>
        <button id="ex" class="ed hide">Export</button>
    </header>
    <main id="stage"><canvas id="c" width="960" height="540"></canvas></main>
    <div id="st"></div>
    <aside id="tools" class="ed hide" aria-label="Drawing tools">
        <div class="g"><button data-t="sk" class="on">Sketch</button><button data-t="cl">Ink</button><button id="er">Eraser</button></div>
        <div class="g"><input id="col" type="color" value="#2f6bff" aria-label="Colour"><button id="sw" aria-label="Colour wheel"></button><input id="sz" type="range" min="1" max="60" value="6" aria-label="Size"><button id="un">Undo</button></div>
        <div class="g" id="br"></div>
        <div class="g"><button id="rb" class="hide">Remove brush</button><button id="sk" class="on">Sketch on</button><button id="on" class="on">Onion skin</button></div>
        <div class="g" id="md"><button data-m="draw" class="on">Draw</button><button data-m="fill">Fill</button><button data-m="pick">Pick</button></div>
        <div class="g sl"><label>Opacity<input id="op" type="range" min="5" max="100" value="100"></label><label>Smoothing<input id="sm" type="range" min="0" max="90" value="45"></label><label>Spacing<input id="spc" type="range" min="3" max="100" value="10"></label></div>
        <div class="g" id="ac"><button id="rd">Redo</button><button id="dl">Delete frame</button><button id="png">Save PNG</button><button id="zf">Fit view</button></div>
    </aside>
    <footer id="tl" class="ed hide">
        <div class="scrub"><canvas id="mk" height="4"></canvas><input id="sc" type="range" min="0" max="0" value="0" aria-label="Frame"></div>
        <button id="pv" aria-label="Previous frame"></button><button id="pl">Play</button><button id="nx" aria-label="Next frame"></button>
        <span id="fl"></span><span class="sp"></span><button id="ad">New frame</button><button id="du">Duplicate</button>
    </footer>
    <div id="cw" class="hide">
        <div class="card"><canvas id="wh" width="240" height="240"></canvas><input id="vl" type="range" min="0" max="100" value="100" aria-label="Brightness">
            <div id="pal"></div>
            <div class="row"><b id="hx"></b><button id="cd" class="p">Done</button></div>
        </div>
    </div>
    <script>
        const $ = s => document.querySelector(s),
            sleep = ms => new Promise(r => setTimeout(r, ms)),
            K = ['sk', 'cl'];
        const S = {
            W: 960,
            H: 540,
            fps: 12,
            fr: [],
            cur: 0,
            tool: 'sk',
            er: 0,
            showSk: 1,
            onion: 1,
            col: {
                sk: '#2f6bff',
                cl: '#111111'
            },
            size: 6,
            hist: [],
            play: 0,
            pen: 0,
            vid: null,
            pc: new Map,
            pq: {},
            lr: [],
            rem: 0,
            all: 0,
            exp: 0,
            st: null
        };
        const c = $('#c'),
            x = c.getContext('2d', {
                alpha: false
            }),
            mk = (w, h) => {
                const e = document.createElement('canvas');
                e.width = w;
                e.height = h;
                return e
            },
            ctx = e => {
                const g = e.getContext('2d', {
                    alpha: true
                });
                g.imageSmoothingEnabled = true;
                g.imageSmoothingQuality = 'high';
                return g
            },
            stat = t => $('#st').textContent = t;
        // High-quality brush rasterization and lower-latency input defaults.
        x.imageSmoothingEnabled = true;
        x.imageSmoothingQuality = 'high';
        const L = (f, k) => {
            f.c = f.c || {};
            return f.c[k] || (f.c[k] = mk(S.W, S.H))
        };

        /* ---------- brushes: stamp tips (white + alpha), built-in and imported ---------- */
        const proc = f => {
            const t = mk(256, 256),
                g = ctx(t);
            g.scale(4, 4);
            f(g);
            return t
        };
        const B = [{
                name: 'Pen',
                sp: .08,
                fl: 1,
                tip: proc(g => {
                    g.fillStyle = '#fff';
                    g.beginPath();
                    g.arc(32, 32, 31, 0, 7);
                    g.fill()
                })
            },
            {
                name: 'Soft',
                sp: .1,
                fl: .35,
                tip: proc(g => {
                    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                    r.addColorStop(0, '#fff');
                    r.addColorStop(1, 'rgba(255,255,255,0)');
                    g.fillStyle = r;
                    g.fillRect(0, 0, 64, 64)
                })
            },
            {
                name: 'Pencil',
                sp: .12,
                fl: .7,
                rot: 1,
                tip: proc(g => {
                    for (let i = 0; i < 280; i++) {
                        const a = Math.random() * 6.28,
                            r = Math.sqrt(Math.random()) * 30;
                        g.fillStyle = `rgba(255,255,255,${.3+Math.random()*.7})`;
                        g.fillRect(32 + Math.cos(a) * r, 32 + Math.sin(a) * r, 2.4, 2.4)
                    }
                })
            }
        ];
        S.br = B[0];

        function tint(b, col) {
            if (b.tc && b.tc.col === col) return b.tc.cv;
            const t = mk(b.tip.width, b.tip.height),
                g = ctx(t);
            g.fillStyle = col;
            g.fillRect(0, 0, t.width, t.height);
            g.globalCompositeOperation = 'destination-in';
            g.drawImage(b.tip, 0, 0);
            b.tc = {
                col,
                cv: t
            };
            return t
        }

        function tipFrom(w, h, m) {
            const t = mk(w, h),
                g = ctx(t),
                d = g.createImageData(w, h);
            for (let i = 0; i < m.length; i++) {
                d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = 255;
                d.data[i * 4 + 3] = m[i]
            }
            g.putImageData(d, 0, 0);
            const M = Math.max(w, h),
                s = Math.min(1, 256 / M),
                n = Math.max(2, Math.round(M * s)),
                q = mk(n, n);
            ctx(q).drawImage(t, (n - w * s) / 2, (n - h * s) / 2, w * s, h * s);
            return q
        }

        function maskOf(w, h, v) {
            let e = 0,
                k = 0;
            for (let i = 0; i < w; i++)
                for (const y of [0, h - 1]) {
                    e += v[y * w + i];
                    k++
                }
            for (let j = 0; j < h; j++)
                for (const q of [0, w - 1]) {
                    e += v[j * w + q];
                    k++
                }
            const iv = e / k > 127;
            return v.map(a => iv ? 255 - a : a)
        } // brush edges should be empty; flip if they're bright
        async function fromImg(b) {
            const im = new Image;
            im.src = URL.createObjectURL(b);
            await im.decode();
            const W = im.naturalWidth || 256,
                H = im.naturalHeight || 256,
                s = Math.min(1, 256 / Math.max(W, H)),
                w = Math.max(1, Math.round(W * s)),
                h = Math.max(1, Math.round(H * s)),
                t = mk(w, h),
                g = ctx(t);
            g.drawImage(im, 0, 0, w, h);
            URL.revokeObjectURL(im.src);
            const d = g.getImageData(0, 0, w, h).data,
                a = new Uint8ClampedArray(w * h),
                l = new Uint8ClampedArray(w * h);
            let lo = 255;
            for (let i = 0; i < a.length; i++) {
                a[i] = d[i * 4 + 3];
                lo = Math.min(lo, a[i]);
                l[i] = d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11
            }
            return tipFrom(w, h, lo < 250 ? a : maskOf(w, h, l))
        }
        async function procreate(f, nm) {
            if (!window.JSZip) throw 0;
            const z = await JSZip.loadAsync(f),
                ps = Object.keys(z.files).filter(p => /(^|\/)Shape\.png$/i.test(p)),
                o = [];
            for (const p of ps) o.push({
                n: ps.length > 1 ? nm + ' ' + (o.length + 1) : nm,
                t: await fromImg(new Blob([await z.file(p).async('arraybuffer')], {
                    type: 'image/png'
                }))
            });
            return o
        }

        function abr(buf, nm) {
            const v = new DataView(buf),
                u = new Uint8Array(buf),
                out = [];
            let p = 0;
            const i16 = () => (p += 2, v.getInt16(p - 2)),
                i32 = () => (p += 4, v.getInt32(p - 4)),
                b8 = () => u[p++];
            const pix = (w, h, dep, cm) => {
                const bp = dep >> 3,
                    a = new Uint8ClampedArray(w * h),
                    row = new Uint8Array(w * bp),
                    cn = [];
                if (cm)
                    for (let y = 0; y < h; y++) cn.push(i16());
                for (let y = 0; y < h; y++) {
                    if (cm) {
                        const e = p + cn[y];
                        let i = 0;
                        while (p < e && i < row.length) {
                            const n = v.getInt8(p++);
                            if (n >= 0) {
                                for (let k = 0; k <= n && i < row.length; k++) row[i++] = u[p++]
                            } else if (n > -128) {
                                const r = u[p++];
                                for (let k = 0; k < 1 - n && i < row.length; k++) row[i++] = r
                            }
                        }
                        p = e
                    } else
                        for (let i = 0; i < row.length; i++) row[i] = u[p++];
                    for (let i = 0; i < w; i++) a[y * w + i] = row[i * bp]
                }
                return a
            };
            const mkB = (w, h, a, n, sp) => ({
                    n,
                    t: tipFrom(w, h, maskOf(w, h, a)),
                    sp
                }),
                ok = (w, h, d) => w > 1 && h > 1 && w < 5e3 && h < 5e3 && (d == 8 || d == 16);
            const ver = i16();
            if (ver < 6) {
                const n = i16();
                for (let k = 0; k < n; k++) {
                    const ty = i16(),
                        sz = i32(),
                        nx = p + sz;
                    if (ty == 2) {
                        i32();
                        const sp = i16();
                        let nn = nm + ' ' + (k + 1);
                        if (ver == 2) {
                            const N = i32();
                            let s = '';
                            for (let j = 0; j < N - 1; j++) s += String.fromCharCode(i16());
                            i16();
                            nn = s || nn
                        }
                        p += 9;
                        const t = i32(),
                            l = i32(),
                            b = i32(),
                            r = i32(),
                            d = i16(),
                            cm = b8(),
                            w = r - l,
                            h = b - t;
                        if (ok(w, h, d)) out.push(mkB(w, h, pix(w, h, d, cm), nn, sp / 100))
                    }
                    p = nx
                }
            } else {
                p = 4;
                let k = 0;
                while (p + 12 <= u.length) {
                    const tag = String.fromCharCode(u[p + 4], u[p + 5], u[p + 6], u[p + 7]),
                        sz = v.getInt32(p + 8);
                    p += 12;
                    const s0 = p;
                    if (tag == 'samp')
                        while (p + 4 < s0 + sz) {
                            const N = i32();
                            if (N <= 0) break;
                            const nx = p + ((N + 3) & ~3);
                            p += b8();
                            const lim = Math.min(nx - 19, p + 600); // locate the tip's bounds record after the item header
                            for (let q = p; q < lim; q++) {
                                const t = v.getInt32(q),
                                    l = v.getInt32(q + 4),
                                    b = v.getInt32(q + 8),
                                    r = v.getInt32(q + 12),
                                    d = v.getInt16(q + 16),
                                    cm = u[q + 18],
                                    w = r - l,
                                    h = b - t;
                                if (ok(w, h, d) && cm < 2 && (cm ? q + 19 + 2 * h < nx : q + 19 + w * h * (d >> 3) <= nx)) {
                                    p = q + 19;
                                    try {
                                        out.push(mkB(w, h, pix(w, h, d, cm), nm + ' ' + (++k), .12))
                                    } catch (_) {}
                                    break
                                }
                            }
                            p = nx
                        }
                    p = s0 + Math.max(sz, 0)
                }
            }
            return out
        }
        const addB = (n, t, sp) => B.push({
            name: n,
            tip: t,
            sp: Math.min(1, Math.max(.04, sp || .12)),
            fl: .85,
            cus: 1
        });

        function saveB() {
            try {
                localStorage.setItem('si.b', JSON.stringify(B.filter(b => b.cus).map(b => [b.name, b.sp, b.tip.toDataURL()])));
                return 1
            } catch (_) {
                return 0
            }
        }
        async function loadB() {
            try {
                for (const [n, sp, u] of JSON.parse(localStorage.getItem('si.b') || '[]')) {
                    const im = new Image;
                    im.src = u;
                    await im.decode();
                    const t = mk(im.naturalWidth, im.naturalHeight);
                    ctx(t).drawImage(im, 0, 0);
                    addB(n, t, sp)
                }
            } catch (_) {}
            chips()
        }

        function sel(b) {
            S.br = b;
            [...$('#br').children].forEach((e, j) => e.classList.toggle('on', B[j] == b));
            $('#rb').classList.toggle('hide', !b.cus)
        }

        function chips() {
            $('#br').replaceChildren(...B.map(b => {
                const k = document.createElement('button'),
                    i = document.createElement('i');
                k.className = 'chip';
                k.title = b.name;
                k.setAttribute('aria-label', b.name);
                i.style.setProperty('--m', `url(${b.u||(b.u=b.tip.toDataURL())})`);
                k.append(i);
                k.onclick = () => sel(b);
                return k
            }));
            sel(S.br)
        }
        $('#rb').onclick = () => {
            if (!S.br.cus) return;
            B.splice(B.indexOf(S.br), 1);
            S.br = B[0];
            saveB();
            chips()
        };
        $('#bf').onchange = async e => {
            const fs = [...e.target.files];
            e.target.value = '';
            let n = 0,
                bad = 0;
            for (const f of fs) {
                stat('Importing ' + f.name + '…');
                try {
                    const nm = f.name.replace(/\.[^.]+$/, ''),
                        ext = f.name.split('.').pop().toLowerCase();
                    const r = ext == 'abr' ? abr(await f.arrayBuffer(), nm) : /^(brush|brushset|zip)$/.test(ext) ? await procreate(f, nm) : [{
                        n: nm,
                        t: await fromImg(f)
                    }];
                    if (!r.length) bad++;
                    for (const b of r) {
                        addB(b.n, b.t, b.sp);
                        n++
                    }
                } catch (_) {
                    bad++
                }
            }
            if (n) S.br = B[B.length - 1];
            chips();
            const kept = n ? saveB() : 1;
            stat(n ? `Added ${n} brush${n>1?'es':''}.` + (bad ? ` ${bad} file${bad>1?'s':''} couldn’t be read.` : '') + (kept ? '' : ' Too many to keep after closing.') : 'Couldn’t read a brush from that file. Try exporting its tip as a PNG.')
        };

        /* ---------- frames load on demand: video plates via seek queue, drawings as PNG blobs ---------- */
        const near = v => S.all || Math.abs(v - (S.fr[S.cur] || {}).v) < 4;
        const PL = {
                q: [],
                run: 0,
                j: new Map
            },
            FLT = () => AD.br != 100 || AD.ct != 100 || AD.sa != 100 || AD.bl > 0;
        const PLT = v => {
            const p = S.pc.get(v);
            if (p) return p;
            const c = S.cp;
            return c && c.d === S.vid && c.v === v ? c.p : null
        };

        function plReset() {
            for (const j of PL.j.values()) j.r(null);
            PL.q = [];
            PL.j.clear()
        }

        function plate(v, pri) {
            if (v < 0 || !S.vid) return null;
            const h = S.pc.get(v);
            if (h) {
                S.pc.delete(v);
                S.pc.set(v, h);
                return h
            }
            let j = PL.j.get(v);
            if (!j) {
                j = {
                    v,
                    pri: 0
                };
                j.p = new Promise(r => j.r = r);
                PL.j.set(v, j);
                PL.q.push(j)
            }
            if (pri) j.pri = 1;
            plPump();
            return j.p
        }
        async function plPump() {
            if (PL.run) return;
            PL.run = 1;
            try {
                while (PL.q.length) {
                    const cv = (S.fr[S.cur] || {}).v;
                    PL.q.sort((a, b) => b.pri - a.pri || Math.abs(a.v - cv) - Math.abs(b.v - cv));
                    const j = PL.q.shift();
                    let p = S.pc.get(j.v) || null;
                    if (!p && !S.live && near(j.v) && (j.pri || !dr)) {
                        try {
                            p = await seek(j.v)
                        } catch (_) {
                            p = null
                        }
                    }
                    PL.j.delete(j.v);
                    j.r(p)
                }
            } finally {
                PL.run = 0
            }
        }
        const frameReady = d => new Promise(r => {
            const t = setTimeout(r, 140),
                f = () => {
                    clearTimeout(t);
                    r()
                };
            d.requestVideoFrameCallback ? d.requestVideoFrameCallback(f) : requestAnimationFrame(() => requestAnimationFrame(f))
        });
        async function seek(v) {
            const d = S.vid;
            if (!d) return null;
            const t = Math.max(0, Math.min((v + .02) / S.fps, (d.duration || 1e9) - .001));
            if (Math.abs(d.currentTime - t) > .0005 || d.seeking) {
                await new Promise(r => {
                    let k = 0;
                    const e = () => {
                        if (k) return;
                        k = 1;
                        d.removeEventListener('seeked', e);
                        r()
                    };
                    d.addEventListener('seeked', e);
                    d.currentTime = t;
                    setTimeout(e, 1800)
                });
                await frameReady(d)
            }
            if (d !== S.vid) return null;
            const p = mk(S.W, S.H);
            ctx(p).drawImage(d, 0, 0, S.W, S.H);
            S.pc.set(v, p);
            const mx = Math.max(8, Math.min(40, Math.floor(2e8 / (S.W * S.H * 4))));
            for (const [k, q] of S.pc) {
                if (S.pc.size <= mx) break;
                if (!S.cp || S.cp.p !== q) S.pc.delete(k)
            }
            return p
        }

        function lru(f) {
            const a = S.lr,
                i = a.indexOf(f);
            if (i >= 0) a.splice(i, 1);
            a.push(f);
            for (let j = 0; a.length > Math.max(6, Math.min(16, Math.floor(2.4e8 / (S.W * S.H * 8)))) && j < a.length;) {
                const g = a[j];
                if (g.pend || Math.abs(S.fr.indexOf(g) - S.cur) < 2) {
                    j++;
                    continue
                }
                a.splice(j, 1);
                delete g.c;
                delete g.dp
            }
        }

        function dec(f) {
            if (!f.dp) f.dp = (async () => {
                const nc = {};
                for (const k of K)
                    if (f.b && f.b[k] && !(f.c && f.c[k])) {
                        const bm = await createImageBitmap(f.b[k]),
                            cv = mk(S.W, S.H);
                        ctx(cv).drawImage(bm, 0, 0);
                        nc[k] = cv
                    } f.c = f.c || {};
                for (const k in nc)
                    if (!f.c[k]) f.c[k] = nc[k]
            })();
            lru(f);
            return f.dp
        }

        function save(f, k) {
            const cv = f.c && f.c[k];
            if (!cv) return;
            f.pend = (f.pend || 0) + 1;
            const n = f.sq = (f.sq || 0) + 1;
            cv.toBlob(b => {
                f.bq = f.bq || {};
                if (b && n >= (f.bq[k] || 0)) {
                    f.bq[k] = n;
                    (f.b = f.b || {})[k] = b
                }
                f.pend--
            }, 'image/png')
        }
        async function ensure(i, nb) {
            const f = S.fr[i];
            if (!f) return;
            await Promise.all([plate(f.v, 1), dec(f), ...(nb ? [S.fr[i - 1], S.fr[i + 1]].filter(Boolean).map(dec) : [])])
        }

        function compose(g, i, o) {
            const f = S.fr[i];
            g.globalAlpha = 1;
            g.fillStyle = '#fff';
            g.fillRect(0, 0, S.W, S.H);
            const p = f.v == -2 ? S.bg : S.live && f.v >= 0 ? S.vid : PLT(f.v);
            if (p) g.drawImage(p, 0, 0, S.W, S.H);
            if (o.onion)
                for (let d = -OS.n; d <= OS.n; d++) {
                    const n = d && S.fr[i + d];
                    if (n && n.c) {
                        g.globalAlpha = OS.o / Math.abs(d);
                        for (const k of K)
                            if (n.c[k]) g.drawImage(n.c[k], 0, 0)
                    }
                }
            if (o.sk && f.c && f.c.sk) {
                g.globalAlpha = .6;
                g.drawImage(f.c.sk, 0, 0)
            }
            g.globalAlpha = 1;
            if (f.c && f.c.cl) g.drawImage(f.c.cl, 0, 0)
        }

        /* ---------- UI ---------- */
        const PD = () => Math.min(innerWidth, innerHeight) < 600 ? 6 : 16;

        function fit() {
            const r = $('#stage').getBoundingClientRect(),
                s = Math.max(.05, Math.min((r.width - PD()) / S.W, (r.height - PD()) / S.H));
            c.style.width = S.W * s + 'px';
            c.style.height = S.H * s + 'px'
        }
        new ResizeObserver(fit).observe($('#stage'));

        function ui() {
            const n = S.fr.length,
                s = $('#sc');
            s.max = n - 1;
            s.value = S.cur;
            $('#fl').textContent = `${S.cur+1} / ${n}`;
            stat(`Frame ${S.cur+1} of ${n} · ${S.fps} fps · ${(S.cur/S.fps).toFixed(1)}s`)
        }

        function render() {
            if (S.fr.length) compose(x, S.cur, {
                onion: S.onion && !S.play,
                sk: S.showSk
            })
        }

        function marks() {
            const n = S.fr.length,
                w = Math.min(n, 1000),
                m = $('#mk'),
                g = ctx(m);
            m.width = w;
            g.fillStyle = getComputedStyle(m).color;
            S.fr.forEach((f, i) => {

        /* ---- shape recognition ---- */
        const rdp = (P, e) => {
            if (P.length < 3) return P;
            let m = 0,
                k = 0;
            const a = P[0],
                b = P[P.length - 1],
                dx = b.x - a.x,
                dy = b.y - a.y,
                Ln = Math.hypot(dx, dy) || 1;
            for (let i = 1; i < P.length - 1; i++) {
                const d = Math.abs(dy * P[i].x - dx * P[i].y + b.x * a.y - b.y * a.x) / Ln;
                if (d > m) {
                    m = d;
                    k = i
                }
            }
            return m > e ? [...rdp(P.slice(0, k + 1), e).slice(0, -1), ...rdp(P.slice(k), e)] : [a, b]
        };

        function recog(P) {
            const n = P.length;
            if (n < 4) return null;
            let x0 = 1e9,
                x1 = -1e9,
                y0 = 1e9,
                y1 = -1e9,
                len = 0;
            P.forEach((p, i) => {
                x0 = Math.min(x0, p.x);
                x1 = Math.max(x1, p.x);
                y0 = Math.min(y0, p.y);
                y1 = Math.max(y1, p.y);
                if (i) len += Math.hypot(p.x - P[i - 1].x, p.y - P[i - 1].y)
            });
            const w = x1 - x0,
                h = y1 - y0,
                M = Math.max(w, h, 1),
                dg = Math.hypot(w, h) || 1,
                a = P[0],
                z = P[n - 1],
                cl = Math.hypot(a.x - z.x, a.y - z.y) < .28 * M && len > 1.8 * M,
                mp = q => q.map(p => ({
                    x: p.x,
                    y: p.y,
                    p: .6
                }));
            if (!cl) {
                const v = rdp(P, .04 * dg);
                return v.length <= 2 ? {
                    n: 'Line',
                    v: mp([a, z]),
                    line: 1
                } : {
                    n: 'Polyline',
                    v: mp(v)
                }
            }
            const cx = (x0 + x1) / 2,
                cy = (y0 + y1) / 2,
                rx = w / 2 || 1,
                ry = h / 2 || 1,
                dev = P.reduce((s, p) => s + Math.abs(Math.hypot((p.x - cx) / rx, (p.y - cy) / ry) - 1), 0) / n;
            if (dev < .13) {
                const r = Math.abs(w - h) < .14 * M,
                    R = (rx + ry) / 2;
                return {
                    n: r ? 'Circle' : 'Ellipse',
                    cl: 1,
                    v: mp(Array.from({
                        length: 73
                    }, (_, i) => {
                        const t = i / 72 * 6.2832;
                        return {
                            x: cx + (r ? R : rx) * Math.cos(t),
                            y: cy + (r ? R : ry) * Math.sin(t)
                        }
                    }))
                }
            }
            const f = P.reduce((m, p, i) => {
                    const d = Math.hypot(p.x - a.x, p.y - a.y);
                    return d > m.d ? {
                        d,
                        i
                    } : m
                }, {
                    d: 0,
                    i: 0
                }).i,
                e = .055 * dg,
                v = [...rdp(P.slice(0, f + 1), e).slice(0, -1), ...rdp([...P.slice(f), a], e).slice(0, -1)];
            if (v.length < 3) return {
                n: 'Ellipse',
                cl: 1,
                v: mp([{
                    x: cx - rx,
                    y: cy
                }, {
                    x: cx,
                    y: cy - ry
                }, {
                    x: cx + rx,
                    y: cy
                }, {
                    x: cx,
                    y: cy + ry
                }])
            };
            if (v.length == 4 && v.every((p, i) => {
                    const q = v[(i + 1) % 4],
                        g = Math.abs(Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI) % 90;
                    return Math.min(g, 90 - g) < 12
                })) return {
                n: 'Rectangle',
                cl: 1,
                v: mp([{
                    x: x0,
                    y: y0
                }, {
                    x: x1,
                    y: y0
                }, {
                    x: x1,
                    y: y1
                }, {
                    x: x0,
                    y: y1
                }])
            };
            return {
                n: v.length == 3 ? 'Triangle' : v.length == 4 ? 'Quadrilateral' : v.length + '-gon',
                cl: 1,
                v: mp(v)
            }

    <script>
        (() => {
            const PB = {
                    m: 0,
                    sp: 1,
                    a: -1,
                    b: -1
                },
                MD = ['Loop', 'Ping-pong', 'Once'],
                SP = [1, 2, .5];
            let TH = 58,
                CW = 64,
                W = 70,
                FB = null,
                raf = 0,
                tT = 0;
            const dm = () => {
                CW = Math.max(34, Math.min(96, Math.round(TH * S.W / S.H)));
                W = CW + 6
            };
            const nb = (id, t, h) => Object.assign(document.createElement('button'), {
                    id,
                    textContent: t,
                    title: h
                }),
                sv = () => Object.assign(document.createElement('i'), {
                    className: 'sv'
                });
            $('#tl').insertAdjacentHTML('afterbegin', `<div id='fs'><div id='fsi'></div></div>`);
            const tc = document.createElement('div');
            tc.id = 'tc';
            ['#pv', '#pl', '#nx', '#fl', '.sp', '#ad', '#du'].forEach(s => tc.append($('#tl ' + s)));
            $('#tl').append(tc);
            const spc = $('#tc .sp');
            [nb('pm', 'Loop', 'Playback mode'), nb('spd', '1×', 'Playback speed'), nb('fi', 'In', 'Loop start (tap again to clear)'), nb('fo', 'Out', 'Loop end (tap again to clear)'), nb('onb', 'Onion', 'Onion skin')].forEach(e => tc.insertBefore(e, spc));
            tc.append(sv(), nb('fcp', 'Copy', 'Copy frame'), nb('fpa', 'Paste', 'Paste frame after this one'), nb('fml', '◂', 'Move frame left'), nb('fmr', '▸', 'Move frame right'), nb('fdl', 'Delete', 'Delete frame'), nb('fsb', 'Filmstrip', 'Show or hide the filmstrip'));
            const fs = $('#fs'),
                fi = $('#fsi'),
                paint = () => {
                    cancelAnimationFrame(raf);
                    raf = requestAnimationFrame(draw)
                };
            async function mkTh(f) {
                if (f.th || f.thp) return;
                f.thp = 1;
                dm();
                try {
                    const t = await window.__thumb(f, Math.round(CW * 1.5), Math.round(TH * 1.5));
                    if (t) {
                        f.th = 1;
                        f.thc = t;
                        f.thu = 1;
                        t.style.cssText = 'width:100%;height:100%;display:block';
                        f.thp = 0;
                        paint();
                        return
                    }
                } catch (_) {
                    f.th = 1
                }
                f.thp = 0
            }
            const DM = new Map;

            function draw() {
                const n = S.fr.length;
                if (!n) return;
                dm();
                const h = TH,
                    a = Math.max(0, Math.floor(fs.scrollLeft / W) - 2),
                    z = Math.min(n - 1, Math.ceil((fs.scrollLeft + fs.clientWidth) / W) + 2),
                    r1 = PB.b < 0 ? n - 1 : PB.b,
                    keep = new Set;
                fi.style.cssText = `width:${n*W+12}px;height:${h+16}px`;
                for (let i = a; i <= z; i++) {
                    const f = S.fr[i];
                    if (!f) break;
                    keep.add(i);
                    let d = DM.get(i);
                    if (!d) {
                        d = document.createElement('button');
                        d.append(Object.assign(document.createElement('span'), {
                            textContent: i + 1
                        }));
                        DM.set(i, d)
                    }
                    d.className = 'fc' + (f.d ? ' d' : '') + (i == S.cur ? ' on' : '') + (PB.a >= 0 && i >= PB.a && i <= r1 ? ' rg' : '') + (i == PB.a ? ' ra' : '') + (i == PB.b ? ' rb' : '');
                    d.style.cssText = `left:${6+i*W}px;width:${CW}px;height:${h}px`;
                    d.dataset.i = i;
                    const t = f.thc || null;
                    if (d._t !== t) {
                        if (d._t) d._t.remove();
                        if (t) d.prepend(t);
                        d._t = t
                    }
                    if (d.parentNode !== fi) fi.append(d);
                    if ((f.d || f.v >= 0 || f.v == -2) && !f.th) mkTh(f)
                }
                for (const [i, d] of DM)
                    if (!keep.has(i)) {
                        d.remove();
                        DM.delete(i)
                    }
                if (n > 150)
                    for (let j = 0; j < n; j++)
                        if (j < a - 60 || j > z + 60) {
                            const g = S.fr[j];
                            if (g && g.thc) g.thc = g.th = g.thu = null
                        }
            }
            const u0 = ui,
                m0 = marks,
                s0 = save;
            ui = function() {
                u0();
                dm();
                const x0 = S.cur * W;
                if (x0 < fs.scrollLeft || x0 + W + 12 > fs.scrollLeft + fs.clientWidth) fs.scrollLeft = x0 - fs.clientWidth / 2 + W / 2;
                paint()
            };
            marks = function() {
                m0();
                paint()
            };
            save = function(f, k) {
                s0(f, k);
                f.th = f.thu = null;
                clearTimeout(tT);
                tT = setTimeout(paint, 300)
            };
            fs.onscroll = paint;
            addEventListener('resize', paint);
            fi.onclick = e => {
                const b = e.target.closest('.fc');
                if (b) {
                    S.play = 0;
                    go(+b.dataset.i)
                }
            };
            $('#pl').onclick = async e => {
                const b = e.currentTarget;
                if (S.play) {
                    S.play = 0;
                    return
                }
                S.play = 1;
                b.textContent = 'Stop';
                ic(b, 'stop');
                const d = S.vid,
                    n = S.fr.length,
                    a = PB.a < 0 ? 0 : PB.a,
                    z = PB.b < 0 ? n - 1 : Math.min(PB.b, n - 1),
                    N = z - a + 1,
                    P = Math.max(1, 2 * N - 2),
                    fp = 1000 / S.fps / PB.sp;
                if (d && !d.isConnected) {
                    document.querySelectorAll('body>video').forEach(v => v.remove());
                    d.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
                    document.body.append(d)
                }
                if (S.cur < a || S.cur > z) {
                    S.cur = a;
                    ui();
                    await ensure(a, 1)
                }
                S.live = d ? 1 : 0;
                const t0 = performance.now(),
                    q0 = S.cur - a;
                while (S.play) {
                    const q = q0 + Math.floor((performance.now() - t0) / fp);
                    let i;
                    if (PB.m == 2) {
                        if (q >= N) break;
                        i = a + q
                    } else if (PB.m == 1) {
                        const m = q % P;
                        i = a + (m < N ? m : P - m)
                    } else i = a + q % N;
                    if (i !== S.cur) {
                        S.cur = i;
                        ui();
                        for (let j = 0; j < 4; j++)
                            if (S.fr[i + j]) dec(S.fr[i + j])
                    }
                    const f = S.fr[S.cur];
                    if (!f) break;
                    if (d) {
                        if (f.v >= 0) {
                            const w = f.v / S.fps;
                            if (Math.abs(d.currentTime - w) > (PB.m == 1 ? .4 : 1.5) / S.fps) d.currentTime = w;
                            if (d.paused && PB.m != 1) d.play().catch(() => 0)
                        } else d.pause()
                    }
                    render();
                    await new Promise(requestAnimationFrame)
                }
                S.play = 0;
                S.live = 0;
                if (d) d.pause();
                b.textContent = 'Play';
                ic(b, 'play');
                await go(S.cur)
            };
            const sync = () => {
                $('#pm').textContent = MD[PB.m];
                $('#spd').textContent = PB.sp + '×';
                $('#fi').classList.toggle('on', PB.a >= 0);
                $('#fo').classList.toggle('on', PB.b >= 0);
                $('#onb').classList.toggle('on', !!S.onion);
                paint()
            };
            $('#pm').onclick = () => {
                PB.m = (PB.m + 1) % 3;
                sync()
            };
            $('#spd').onclick = () => {
                PB.sp = SP[(SP.indexOf(PB.sp) + 1) % 3];
                sync()
            };
            $('#fi').onclick = () => {
                PB.a = PB.a == S.cur ? -1 : S.cur;
                if (PB.b >= 0 && PB.b < PB.a) PB.b = -1;
                sync()
            };
            $('#fo').onclick = () => {
                PB.b = PB.b == S.cur ? -1 : S.cur;
                if (PB.b >= 0 && PB.a > PB.b) PB.a = -1;
                sync()
            };
            $('#onb').onclick = () => {
                $('#on').click();
                sync()
            };
            $('#fcp').onclick = async () => {
                const f = S.fr[S.cur];
                if (!f) return;
                await dec(f);
                FB = {};
                for (const k of K)
                    if (f.c && f.c[k]) {
                        const t = mk(S.W, S.H);
                        ctx(t).drawImage(f.c[k], 0, 0);
                        FB[k] = t
                    } toast('Frame copied')
            };
            $('#fpa').onclick = async () => {
                if (!FB) return toast('Copy a frame first');
                const o = S.fr[S.cur],
                    f = {
                        v: o.v,
                        c: {},
                        d: 1
                    };
                for (const k in FB) {
                    f.c[k] = mk(S.W, S.H);
                    ctx(f.c[k]).drawImage(FB[k], 0, 0);
                    save(f, k)
                }
                f.dp = Promise.resolve();
                S.fr.splice(S.cur + 1, 0, f);
                lru(f);
                S.hist = [];
                marks();
                await go(S.cur + 1)
            };
            $('#fdl').onclick = () => $('#dl').click();
            const mvf = async d => {
                const i = S.cur,
                    j = i + d;
                if (j < 0 || j >= S.fr.length) return;
                [S.fr[i], S.fr[j]] = [S.fr[j], S.fr[i]];
                S.hist = [];
                marks();
                await go(j)
            };
            $('#fml').onclick = () => mvf(-1);
            $('#fmr').onclick = () => mvf(1);
            $('#fsb').onclick = () => {
                $('#tl').classList.toggle('min');
                paint()
            };
            if (innerHeight < 700) $('#tl').classList.add('min');
            window.__th = n => {
                TH = n;
                S.fr.forEach(f => {
                    f.th = null
                });
                dm();
                paint()
            };
            sync()
        })();
    </script>

    <script>
        (() => {
            const TR = [
                    ['bg', 'Video', '#9aa0ac'],
                    ['sk', 'Sketch', '#64a0ff'],
                    ['cl', 'Ink', '#ffb340']
                ],
                RH = 26,
                EZ = {
                    hold: t => t < 1 ? 0 : 1,
                    sine: t => .5 - Math.cos(Math.PI * t) / 2,
                    back: t => {
                        const c = 1.70158;
                        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2)
                    },
                    elas: t => t <= 0 || t >= 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2.0944) + 1,
                    lin: t => t,
                    in: t => t * t,
                    out: t => 1 - (1 - t) * (1 - t),
                    io: t => t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t),
                    bnc: t => {
                        const n = 7.5625,
                            d = 2.75;
                        return t < 1 / d ? n * t * t : t < 2 / d ? n * (t -= 1.5 / d) * t + .75 : t < 2.5 / d ? n * (t -= 2.25 / d) * t + .9375 : n * (t -= 2.625 / d) * t + .984375
                    }
                },
                ID = {
                    x: 0,
                    y: 0,
                    s: 1,
                    r: 0,
                    o: 1
                },
                M = {
                    k: {
                        bg: [],
                        sk: [],
                        cl: []
                    },
                    t: 'cl',
                    sel: null,
                    mv: 0,
                    perf: 0,
                    drag: 0,
                    live: null,
                    dn: 0,
                    last: -1,
                    ez: 'io',
                    ppf: 10,
                    ver: 0,
                    aud: null,
                    sp: 1,
                    lp: {},
                    hd: {}
                },
                tst = t => typeof toast == 'function' && toast(t);
            let sig = '';

            /* ---- keyframe maths ---- */
            function val(t, f) {
                const a = M.k[t];
                if (M.hd[t]) return {
                    ...ID,
                    o: 0
                };
                let g = f;
                if (M.lp[t] && a.length > 1 && f > a[a.length - 1].f) {
                    const s0 = a[0].f;
                    g = s0 + (f - s0) % (a[a.length - 1].f - s0)
                }
                return val1(t, g)
            }

            function BZ(c, t) {
                const [x1, y1, x2, y2] = c, B = (a, b, s) => 3 * a * s * (1 - s) * (1 - s) + 3 * b * s * s * (1 - s) + s * s * s;
                let s = t;
                for (let i = 0; i < 8; i++) {
                    const x = B(x1, x2, s) - t,
                        d = 3 * x1 * (1 - s) * (1 - s) + 6 * (x2 - x1) * s * (1 - s) + 3 * (1 - x2) * s * s;
                    if (Math.abs(x) < 1e-4 || Math.abs(d) < 1e-6) break;
                    s -= x / d
                }
                return B(y1, y2, Math.max(0, Math.min(1, s)))
            }
            window.__bz = BZ;

            function val1(t, f) {
                if (M.dn && f == S.cur) return ID;
                if (M.live && t == M.t && f == S.cur) return M.live;
                const a = M.k[t];
                if (!a.length) return ID;
                if (f <= a[0].f) return a[0];
                const z = a[a.length - 1];
                if (f >= z.f) return z;
                let i = 0;
                while (a[i + 1].f <= f) i++;
                const p = a[i],
                    q = a[i + 1],
                    u = p.e == 'bez' ? BZ(p.bz || [.42, 0, .58, 1], (f - p.f) / (q.f - p.f)) : EZ[p.e || 'lin']((f - p.f) / (q.f - p.f)),
                    m = k => p[k] + (q[k] - p[k]) * u;
                const h = a[i - 1] || p,
                    n = a[i + 2] || q,
                    sp = M.sp && a.length > 2,
                    cr = k => {
                        const t2 = u * u,
                            t3 = t2 * u;
                        return .5 * (2 * p[k] + (q[k] - h[k]) * u + (2 * h[k] - 5 * p[k] + 4 * q[k] - n[k]) * t2 + (3 * p[k] - h[k] - 3 * q[k] + n[k]) * t3)
                    };
                return {
                    x: sp ? cr('x') : m('x'),
                    y: sp ? cr('y') : m('y'),
                    s: Math.max(.02, m('s')),
                    r: m('r'),
                    o: Math.max(0, Math.min(1, m('o')))
                }
            }

            function setK(t, f, v, e) {
                const a = M.k[t];
                let k = a.find(q => q.f == f);
                if (!k) {
                    k = {
                        f
                    };
                    a.push(k);
                    a.sort((p, q) => p.f - q.f)
                }
                Object.assign(k, {
                    x: v.x,
                    y: v.y,
                    s: Math.max(.02, v.s),
                    r: v.r,
                    o: v.o
                });
                if (e) k.e = e;
                else if (!k.e) k.e = M.ez;
                M.ver++;
                return k
            }
            const dw = (g, im, v) => {
                if (!im) return;
                const a = g.globalAlpha;
                g.save();
                g.globalAlpha = a * v.o;
                g.translate(S.W / 2 + v.x, S.H / 2 + v.y);
                g.rotate(v.r * Math.PI / 180);
                g.scale(v.s, v.s);
                g.drawImage(im, -S.W / 2, -S.H / 2, S.W, S.H);
                g.restore()
            };

            /* ---- compose with per-track transforms (used by preview, playback and every export) ---- */
            compose = function(g, i, o) {
                const f = S.fr[i];
                if (!f) return;
                g.globalAlpha = 1;
                g.globalCompositeOperation = 'source-over';
                if (o.tr) g.clearRect(0, 0, S.W, S.H);
                else {
                    g.fillStyle = S.bgc || '#fff';
                    g.fillRect(0, 0, S.W, S.H)
                }
                const p = f.v == -2 ? S.bg : S.live && f.v >= 0 ? S.vid : PLT(f.v);
                if (p && !o.nv && LY.vd.v) {
                    g.globalAlpha = LY.vd.o;
                    if (hasF && FLT()) g.filter = `brightness(${AD.br}%) contrast(${AD.ct}%) saturate(${AD.sa}%) blur(${AD.bl}px)`;
                    dw(g, p, val('bg', i));
                    if (hasF && FLT()) g.filter = 'none'
                }
                if (o.onion)
                    for (let d = -OS.n; d <= OS.n; d++) {
                        const n = d && S.fr[i + d];
                        if (n && n.c) {
                            g.globalAlpha = OS.o / Math.abs(d);
                            for (const k of K)
                                if (n.c[k]) dw(g, n.c[k], val(k, i + d))
                        }
                    }
                for (const k of ['sk', 'cl']) {
                    const l = LY[k];
                    if (l.v && (k == 'cl' || o.sk) && f.c && f.c[k]) {
                        g.globalAlpha = l.o;
                        g.globalCompositeOperation = l.b;
                        dw(g, f.c[k], val(k, i))
                    }
                }
                g.globalAlpha = 1;
                g.globalCompositeOperation = 'source-over'
            };

            /* ---- panel ---- */
            const tc = $('#tc'),
                mo = document.createElement('div');
            mo.id = 'mo';
            mo.innerHTML = `<div class="r"><span class="seg"><button data-mt="bg">Video</button><button data-mt="sk">Sketch</button><button data-mt="cl">Ink</button></span>
<button id="mom" title="Drag to move, pinch to scale and rotate. Wheel scales, Shift+wheel rotates">Move</button><button id="mop" title="Turn on, press Play, then drag. Your movement is recorded">Perform</button>
<button id="moa1">Add key</button><button id="moa2">Delete key</button>
<select id="moz" aria-label="Easing"><option value="lin">Linear</option><option value="in">Ease in</option><option value="out">Ease out</option><option value="io" selected>Ease in-out</option><option value="bnc">Bounce</option><option value="sine">Sine</option><option value="back">Overshoot</option><option value="elas">Elastic</option><option value="hold">Hold (step)</option><option value="bez">Custom curve</option></select>

                });

            }

                const n = S.fr.length,

                }

                        g.fillStyle = sl ? '#fff' : col;
                        g.fill();
                        g.strokeStyle = '#000';
                        g.lineWidth = 1;
                        g.stroke()
                    })

            }

            /* ---- canvas gestures: Move / Perform ---- */
            const cv = $('#c'),
                P = new Map;
            let B = null;
            const ap = v => {
                    if (S.play && M.perf) M.live = v;
                    else setK(M.t, S.cur, v);
                    if (!S.play) render();
                    sig = ''
                },
                snap = () => {
                    B = {
                        v: {
                            ...val(M.t, S.cur)
                        },
                        p: [...P.values()].map(z => ({
                            ...z
                        }))
                    }
                },
                gate = e => {
                    if (e.type == 'pointerdown') {
                        if (!M.mv || e.target !== cv) return 0
                    } else if (!P.has(e.pointerId)) return 0;
                    e.stopImmediatePropagation();
                    e.preventDefault();
                    return 1
                };
            addEventListener('pointerdown', e => {
                if (!gate(e)) {
                    if (!M.mv && e.target === cv && !S.play && TR.some(([t]) => M.k[t].length)) {
                        M.dn = 1;
                        render()
                    }
                    return
                }
                try {
                    cv.setPointerCapture(e.pointerId)
                } catch (_) {}
                P.set(e.pointerId, {
                    x: e.clientX,
                    y: e.clientY
                });
                M.drag = 1;
                M.last = -1;
                snap();
                ap(B.v)
            }, true);
            addEventListener('pointermove', e => {
                if (!gate(e)) return;
                P.set(e.pointerId, {
                    x: e.clientX,
                    y: e.clientY
                });
                const k = S.W / cv.getBoundingClientRect().width,
                    c = [...P.values()],
                    b = B.p,
                    v = {
                        ...B.v
                    };
                if (c.length > 1 && b.length > 1) {
                    const ds = (a, z) => Math.hypot(z.x - a.x, z.y - a.y),
                        an = (a, z) => Math.atan2(z.y - a.y, z.x - a.x),
                        mid = (a, z) => ({
                            x: (a.x + z.x) / 2,
                            y: (a.y + z.y) / 2
                        }),
                        m1 = mid(c[0], c[1]),
                        m0 = mid(b[0], b[1]);
                    v.s = Math.max(.05, B.v.s * ds(c[0], c[1]) / ds(b[0], b[1]));
                    v.r = B.v.r + (an(c[0], c[1]) - an(b[0], b[1])) * 180 / Math.PI;
                    v.x = B.v.x + (m1.x - m0.x) * k;
                    v.y = B.v.y + (m1.y - m0.y) * k
                } else {
                    v.x = B.v.x + (c[0].x - b[0].x) * k;
                    v.y = B.v.y + (c[0].y - b[0].y) * k
                }
                ap(v)
            }, true);
            const up = e => {
                if (gate(e)) {
                    P.delete(e.pointerId);
                    if (P.size) snap();
                    else {
                        M.drag = 0;
                        M.live = null;
                        M.sel = null;
                        if (!S.play) render();
                        sig = ''
                    }
                    return
                }
                if (M.dn) requestAnimationFrame(() => {
                    M.dn = 0;
                    render()
                })
            };
            addEventListener('pointerup', up, true);
            addEventListener('pointercancel', up, true);
            addEventListener('wheel', e => {
                if (!M.mv || !e.target.closest('#stage')) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                const v = {
                    ...val(M.t, S.cur)
                };
                if (e.shiftKey) v.r += e.deltaY * .1;
                else v.s = Math.max(.05, v.s * Math.exp(-e.deltaY * .002));
                ap(v)
            }, {
                passive: false,
                capture: true
            });

            /* ---- watcher: Perform sampling, audio sync, panel redraw ---- */
            let last = -1;
            (function tick() {
                requestAnimationFrame(tick);
                if (M.perf && M.drag && S.play && M.live && S.cur !== M.last) {
                    setK(M.t, S.cur, M.live, 'lin');
                    M.last = S.cur
                }
                const a = M.aud;
                if (a) {
                    const el = a.el;
                    if (S.play && el.paused) {
                        el.currentTime = Math.min(el.duration || 0, S.cur / S.fps);
                        el.play().catch(() => 0)
                    } else if (!S.play && !el.paused) el.pause();
                    else if (S.play && S.cur < last) el.currentTime = S.cur / S.fps
                }
                last = S.cur;
                if (!mo.classList.contains('on')) return;
                const s = [S.cur, S.fr.length, M.ver, M.t, M.sel && M.sel.k.f, S.play, M.mv, M.perf, !!M.aud].join();
                if (s != sig) {
                    sig = s;
                    lane();
                    sync()
                }
            })();
        })();

    <script>
        (() => {
            /* ---- filmstrip thumbnails: video frame + drawing + motion, from a separate decoder ---- */
            const TQ = {
                q: Promise.resolve(),
                v: null,
                src: '',
                c: new Map,
                rd: null
            };
            const keep = (k, t) => {
                TQ.c.set(k, t);
                if (TQ.c.size > 320) TQ.c.delete(TQ.c.keys().next().value);
                return t
            };

            function tvid() {
                if (!S.vid) return null;
                if (!TQ.v || TQ.src !== S.vid.src) {
                    TQ.src = S.vid.src;
                    TQ.c.clear();
                    const v = document.createElement('video');
                    v.muted = true;
                    v.playsInline = true;
                    v.preload = 'auto';
                    v.src = S.vid.src;
                    Object.assign(v.style, {
                        position: 'fixed',
                        left: '0',
                        top: '0',
                        width: '2px',
                        height: '2px',
                        opacity: '.01',
                        pointerEvents: 'none'
                    });
                    if (TQ.v) TQ.v.remove();
                    document.body.append(v);
                    TQ.v = v;
                    TQ.rd = new Promise(r => {
                        v.onloadeddata = r;
                        v.onerror = r
                    })
                }
                return TQ.v
            }

            function thumbPlate(v, w, h, want) {
                const key = v + '|' + w + '|' + TQ.src,
                    hit = TQ.c.get(key);
                if (hit) return Promise.resolve(hit);
                return TQ.q = TQ.q.then(async () => {
                    const h2 = TQ.c.get(key);
                    if (h2) return h2;
                    const t = mk(w, h),
                        g = ctx(t),
                        cur = S.pc.get(v);
                    if (cur) {
                        g.drawImage(cur, 0, 0, w, h);
                        return keep(key, t)
                    }
                    if (want && !want()) return null;
                    const d = tvid();
                    if (!d) return null;
                    await TQ.rd;
                    const tt = Math.min(v / S.fps + .001, d.duration || 1e9);
                    if (Math.abs(d.currentTime - tt) > .0005) await new Promise(r => {
                        const e = () => {
                            d.removeEventListener('seeked', e);
                            r()
                        };
                        d.addEventListener('seeked', e);
                        d.currentTime = tt;
                        setTimeout(r, 900)
                    }).then(() => frameReady(d));
                    g.drawImage(d, 0, 0, w, h);
                    return keep(key, t)
                }).catch(() => null)
            }
            window.__thumb = async (f, w, h) => {
                await 0; /* let draw() attach its buttons first */
                const i = S.fr.indexOf(f),
                    want = () => i >= 0 && !S.play && !S.exp && !dr && document.querySelector(`#fsi .fc[data-i="${i}"]`);
                if (!want()) return null;
                const t = mk(w, h),
                    g = ctx(t),
                    k = w / S.W,
                    X = __mot;
                g.fillStyle = '#fff';
                g.fillRect(0, 0, w, h);
                let p = f.v == -2 ? S.bg : null;
                if (f.v >= 0 && S.vid) {
                    p = await thumbPlate(f.v, w, h, want);
                    if (!p) return null
                }
                g.save();
                g.scale(k, k);
                if (p) X.dw(g, p, X.val('bg', i));
                for (const l of K) {
                    const s = f.c && f.c[l] || (f.b && f.b[l] ? await createImageBitmap(f.b[l]) : 0);
                    if (s) {
                        g.globalAlpha = l == 'sk' ? .6 : 1;
                        X.dw(g, s, X.val(l, i))
                    }
                }
                g.restore();
                return t
            };
            /* motion edits change every thumbnail: refresh lazily */
            let tv = 0,
                to = 0;
            (function w() {
                requestAnimationFrame(w);
                const m = __mot.M.ver;
                if (m !== tv) {
                    tv = m;
                    clearTimeout(to);
                    to = setTimeout(() => {
                        S.fr.forEach(f => {
                            f.th = f.thu = null

                    }, {
                        t: 'Clear track',
                        f: () => ck('morc')
                    }],
                    stage: () => [{
                        t: 'Undo',
                        f: () => ck('un')
                    }, {
                        t: 'Redo',
                        f: () => ck('rd')
                    }, {
                        t: S.play ? 'Pause' : 'Play',
                        f: () => ck('pl')
                    }, {
                        t: 'New frame',
                        f: () => ck('ad')
                    }, {
                        t: 'Fit view',
                        f: () => ck('zf')
                    }, {
                        t: 'Looks…',
                        m: looks
                    }, {
                        t: 'Focus mode',
                        f: focus
                    }],
                    'v-sz': sizes,
                    'v-op': opac
                };
                let pins = [];
                try {
                    pins = JSON.parse(ls('si.pins')) || []
                } catch (_) {}
                /* floating menu: hold anywhere, slide to an option, let go on it. Dragging past the edge scrolls long menus */
                let hm = null,
                    held = null,
                    tm = 0,
                    p0 = null,
                    sw = 0,
                    fr = 0,
                    pt = {
                        x: 0,
                        y: 0
                    },
                    armed = 0;
                const close = () => {
                        hm && hm.remove();
                        hm = null;
                        held = null;
                        cancelAnimationFrame(fr)
                    },
                    noClick = () => {
                        sw = 1;
                        setTimeout(() => sw = 0, 400)
                    },
                    hot = () => {
                        if (!hm) return null;
                        const il = hm.lastElementChild,
                            r = il.getBoundingClientRect(),
                            {
                                x,
                                y
                            } = pt;
                        let e = null;
                        if (x > r.left - 70 && x < r.right + 70) {
                            if (y >= r.top && y <= r.bottom) armed = 1;
                            if (armed) {
                                if (y < r.top + 14) il.scrollTop -= Math.min(18, (r.top + 14 - y) / 3 + 3);
                                else if (y > r.bottom - 14) il.scrollTop += Math.min(18, (y - r.bottom + 14) / 3 + 3);
                                e = document.elementFromPoint(Math.max(r.left + 4, Math.min(r.right - 4, x)), Math.max(r.top + 4, Math.min(r.bottom - 4, y)));
                                e = e && e.closest('#hm .il button')
                            }
                        }
                        hm.querySelectorAll('.hot').forEach(h => h.classList.remove('hot'));
                        e && e.classList.add('hot');
                        return e
                    },
                    tick = () => {
                        if (hm && held != null) {
                            hot();
                            fr = requestAnimationFrame(tick)
                        }
                    },
                    show = (a, id, title, items, sub) => {
                        close();
                        if (!sub && id && id != 'dk') {
                            const p = pins.includes(id);
                            items = [...items, {
                                t: p ? 'Unpin from dock' : 'Pin to dock',
                                f: () => {
                                    pins = p ? pins.filter(x => x != id) : [...pins, id];
                                    ls('si.pins', JSON.stringify(pins));
                                    tst(p ? 'Unpinned' : 'Pinned to the dock')
                                }
                            }]
                        }
                        hm = el('div', {
                            id: 'hm'
                        });
                        const il = el('div', {
                            className: 'il'
                        });
                        hm.append(el('h6', {
                            textContent: title
                        }), il);
                        items.forEach((it, i) => {
                            const e = el('button', {
                                textContent: it.t,
                                className: it.on && it.on() ? 'on' : ''
                            });
                            e.style.setProperty('--i', i);
                            e.onclick = () => {
                                if (it.m) show(a, id, it.t.replace('…', ''), it.m(), 1);
                                else {
                                    close();
                                    it.f()
                                }
                            };
                            il.append(e)
                        });
                        bd.append(hm);
                        const H = innerHeight,
                            need = items.length * 44 + 8,
                            su = a.top,
                            sd = H - a.bottom,
                            up = su - 52 >= need || (sd - 52 < need && su >= sd);
                        il.style.maxHeight = Math.max(96, Math.min(need, (up ? su : sd) - 52)) + 'px';
                        if (up) hm.classList.add('up');
                        const m = {
                                width: hm.offsetWidth,
                                height: hm.offsetHeight
                            },
                            cx = (a.left + a.right) / 2,
                            x = Math.max(8, Math.min(innerWidth - m.width - 8, cx - m.width / 2)),
                            y = Math.max(8, Math.min(H - m.height - 8, up ? a.top - m.height - 8 : a.bottom + 8));
                        hm.style.cssText += `left:${x}px;top:${y}px;--ox:${cx-x}px;--oy:${up?'100%':'0%'}`;
                        armed = 0
                    },
                    tgt = e => {
                        for (let n = e.target; n && n.nodeType == 1 && n !== bd; n = n.parentElement) {
                            if (n.id == 'c' || n.id == 'hm') return null;
                            if (n.matches('button,label.b,input[type=range]') || (HM[n.id] && (n.id != 'stage' || n === e.target))) return n
                        }
                        return null
                    };

                function openHold(n, e) {
                    const rg = n.matches('input[type=range]'),
                        bt = n.matches('button,label.b'),
                        f = HM[n.id] || (rg ? () => rng(n) : null),
                        a = bt ? n.getBoundingClientRect() : {
                            left: pt.x,
                            right: pt.x,
                            top: pt.y - 16,
                            bottom: pt.y + 16
                        },
                        items = f ? f(n, pt) : (bt && n.id ? [] : null);
                    if (!items) return;
                    if (bt && n.id && !f && n.title) items.push({
                        t: 'What does this do?',
                        f: () => tst(n.title)
                    });
                    show(a, bt ? n.id : '', rg ? (n.getAttribute('aria-label') || 'Value') : lab(n), items);
                    held = e.pointerId;
                    vib();
                    tick()
                }
                addEventListener('pointerdown', e => {
                    if (hm) {
                        if (!hm.contains(e.target)) {
                            close();
                            noClick()
                        }
                        return
                    }
                    if (!S.fr.length) return;
                    const n = tgt(e);
                    if (!n || n.disabled) return;
                    pt = p0 = {
                        x: e.clientX,
                        y: e.clientY
                    };
                    tm = setTimeout(() => {
                        tm = 0;
                        openHold(n, e)
                    }, 380)
                }, true);
                addEventListener('pointermove', e => {
                    pt = {
                        x: e.clientX,
                        y: e.clientY
                    };
                    if (tm && Math.hypot(pt.x - p0.x, pt.y - p0.y) > 10) {
                        clearTimeout(tm);
                        tm = 0
                    }
                }, true);
                ['pointerup', 'pointercancel'].forEach(n => addEventListener(n, e => {
                    clearTimeout(tm);
                    tm = 0;
                    if (hm && held === e.pointerId) {
                        const i = n == 'pointerup' ? hot() : null;
                        held = null;
                        hm.querySelectorAll('.hot').forEach(h => h.classList.remove('hot'));
                        if (i) i.click();
                        noClick()
                    }
                }, true));
                addEventListener('touchmove', e => {
                    if (hm && held != null) e.preventDefault()
                }, {
                    passive: false,
                    capture: true
                });
                addEventListener('click', e => {
                    if (sw && e.isTrusted) {
                        sw = 0;
                        e.stopImmediatePropagation();
                        e.preventDefault()
                    }
                }, true);
                addEventListener('contextmenu', e => {
                    if (tgt(e)) e.preventDefault()
                }, true);
                addEventListener('keydown', e => {
                    if (e.key == 'Escape') close()
                });
                /* floating dock: tap for extras and pinned actions, hold for looks, drag anywhere */
                const dk = el('button', {
                    id: 'dk',
                    title: 'More tools. Hold for looks.',
                    innerHTML: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>'
                });
                let dragged = 0;
                const sp = (ls('si.dk') || '').split('|');
                if (sp.length == 2) {
                    dk.style.left = sp[0];
                    dk.style.top = sp[1];
                    dragged = 1
                }
                let dp = null,
                    dm = 0;
                dk.onpointerdown = e => {
                    dp = {
                        x: e.clientX - dk.offsetLeft,
                        y: e.clientY - dk.offsetTop,
                        sx: e.clientX,
                        sy: e.clientY
                    };
                    dm = 0;
                    dk.setPointerCapture(e.pointerId)
                };
                dk.onpointermove = e => {
                    if (!dp) return;
                    if (Math.hypot(e.clientX - dp.sx, e.clientY - dp.sy) > 8) dm = 1;
                    if (dm) {
                        dragged = 1;
                        dk.style.left = Math.max(4, Math.min(innerWidth - 52, e.clientX - dp.x)) + 'px';
                        dk.style.top = Math.max(4, Math.min(innerHeight - 52, e.clientY - dp.y)) + 'px'
                    }
                };
                dk.onpointerup = dk.onpointercancel = () => {
                    if (dm) ls('si.dk', dk.style.left + '|' + dk.style.top);
                    dp = null
                };
                const dockMenu = () => [
                    ['Share / export', '#ex'],
                    ['Layers', '#lyb'],
                    ['Brushes', '#lb'],
                    ['Undo', '#un'],
                    ['Redo', '#rd'],
                    ['Fit view', '#zf'],
                    ['Search actions', '#ck']
                ].map(([t, q]) => ({
                    t,
                    f: () => {
                        const e = $(q);
                        e && e.click()
                    }
                })).concat([{
                    t: 'Hide interface',
                    f: () => toggleUI()
                }]);
                dk.onclick = () => {
                    if (dm) {
                        dm = 0;
                        return
                    }
                    show(dk.getBoundingClientRect(), 'dk', 'More', dockMenu(), 1)
                };
                const home = () => {
                    if (dragged) return;
                    const r = $('#stage').getBoundingClientRect();
                    dk.style.left = Math.max(4, r.right - 62) + 'px';
                    dk.style.top = Math.max(r.top + 4, Math.min(r.top + r.height * .4, r.bottom - 130)) + 'px'
                };
                bd.append(dk);
                const th = ls('si.th');
                if (th) document.documentElement.dataset.theme = th;
                Object.keys(HM).forEach(id => {
                    const e = $('#' + id);
                    e && e.setAttribute('data-h', 1)
                });
                let tip = ls('si.tip');
                setInterval(() => {
                    const on = !!S.fr.length;
                    dk.style.display = on ? 'flex' : 'none';
                    on && home();
                    if (on && !tip) {
                        tip = 1;
                        ls('si.tip', '1');
                        setTimeout(() => tst('Tip: hold any button for more options'), 900)
                    }
                }, 500);
            } catch (err) {
                console.warn('v17 extras skipped', err)
            }
        })();
    </script>
    <style>

        }

    <script>
        /* Prefer coalesced stylus samples where supported; never delay drawing to wait for a frame. */
        (() => {
            const c = document.querySelector('#c');
            if (!c) return;
            c.style.touchAction = 'none';
            c.addEventListener('pointerdown', e => {
                if (e.pointerType === 'pen') {
                    try {
                        c.setPointerCapture(e.pointerId)
                    } catch (_) {}
                }
            }, {
                passive: false
            });
        })();
    </script>
    <style>

        html,
        body {
            height: 100dvh;

        }

        html[data-dev=phone][data-ori=landscape] #tools {

        }

        html[data-dev=tablet][data-ori=portrait] #tools {

        }

        html[data-dev=tablet][data-ori=landscape] #tools {
            width: clamp(168px, 19vw, 228px)
        }

        html[data-dev=desktop] #tools {
            width: clamp(180px, 15vw, 240px)
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
    <script>
        /* v18: device class + rotation handling */
        (() => {
            const R = document.documentElement;
            let tm = 0,
                last = '';
            const dev = () => {
                    const w = innerWidth,
                        h = innerHeight,
                        s = Math.min(w, h),
                        co = matchMedia('(pointer:coarse)').matches;
                    R.dataset.dev = s < 600 ? 'phone' : ((co && s < 1100) || s < 900) ? 'tablet' : 'desktop';
                    R.dataset.ori = w > h ? 'landscape' : 'portrait'
                },
                settle = () => {
                    dev();
                    try {
                        fit();
                        if (last && last !== R.dataset.ori) {
                            S.z = 1;
                            S.tx = S.ty = 0;
                            xf()
                        }
                        last = R.dataset.ori;
                        render()
                    } catch (_) {}
                    const k = document.getElementById('dk');
                    if (k && k.style.left) {
                        k.style.left = Math.max(4, Math.min(innerWidth - 52, parseFloat(k.style.left))) + 'px';
                        k.style.top = Math.max(4, Math.min(innerHeight - 52, parseFloat(k.style.top))) + 'px'
                    }
                },
                later = () => {
                    dev();
                    clearTimeout(tm);
                    tm = setTimeout(settle, 120);
                    setTimeout(settle, 500)
                };
            ['resize', 'orientationchange'].forEach(n => addEventListener(n, later));
            try {
                screen.orientation.addEventListener('change', later)
            } catch (_) {}
            try {
                visualViewport.addEventListener('resize', later)
            } catch (_) {}
            document.addEventListener('gesturestart', e => e.preventDefault());
            dev();
            last = R.dataset.ori;
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    </script>
